# NOT part of kustomization.yaml on purpose.
#
# Production stays governed by the existing ISTAT blue/green pipelines in the
# `ndc-prod` namespace; our deployer does not need — and must not have — access
# there. This file exists only for the day ISTAT decides to let the new pipeline
# deploy to `istat-ndc-prod` as well; applying it is an explicit, separate act.
#
#   oc apply -f 31-rbac-prod.yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: deployer-edit
  namespace: istat-ndc-prod
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: edit
subjects:
  - kind: ServiceAccount
    name: deployer
    namespace: istat-ndc-cicd
