# Bootstrap bundle — the one-shot apply requested from INFRA/OPS.
#   oc apply -k .
# This bundle targets the dev/test cluster only. Production lives on a separate cluster and
# is not addressed from here at all: see docs/cross-cluster.md.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - 00-namespaces.yaml
  - 10-quota-limits.yaml
  - 20-serviceaccount.yaml
  - 30-rbac-dev-test.yaml
  - 40-workspace-pvc.yaml
  - 50-triggers-rbac.yaml
  - 60-pipelines-scc.yaml
labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/part-of: istat-ndc-platform
      app.kubernetes.io/managed-by: istat-ndc-cicd
