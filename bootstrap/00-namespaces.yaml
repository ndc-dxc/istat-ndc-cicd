# Three namespaces: one control plane for the pipelines, two environments.
#
# There is no production namespace here on purpose. Production runs on a *separate cluster*,
# where this bundle is never applied: see docs/cross-cluster.md. Creating an `istat-ndc-prod`
# namespace next to dev and test would describe a topology that does not exist.
#
# Names use the `istat-ndc` placeholder root agreed as "not the legacy ndc-*".
apiVersion: v1
kind: Namespace
metadata:
  name: istat-ndc-cicd
  annotations:
    openshift.io/display-name: "NDC platform — CI/CD control namespace"
    openshift.io/description: "Tekton pipelines, triggers and the deployer ServiceAccount. No application workloads."
---
apiVersion: v1
kind: Namespace
metadata:
  name: istat-ndc-dev
  annotations:
    openshift.io/display-name: "NDC platform — dev"
  labels:
    istat.it/environment: dev
---
apiVersion: v1
kind: Namespace
metadata:
  name: istat-ndc-test
  annotations:
    openshift.io/display-name: "NDC platform — test"
  labels:
    istat.it/environment: test
