# Manual run — the same thing the trigger creates, useful for a first deploy or a promotion.
#
#   oc create -f pipelinerun-manual.yaml -n istat-ndc-cicd
#
# Promotion to test is this exact file with env: test and the same imageTag.
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  generateName: deploy-sample-service-
  namespace: istat-ndc-cicd
spec:
  pipelineRef:
    name: deploy-service
  taskRunTemplate:
    # No podTemplate here on purpose. Setting a securityContext.fsGroup would also be inherited
    # by Tekton's affinity-assistant StatefulSet, which runs as the `default` ServiceAccount and
    # is admitted by no SCC that allows that group — the run then hangs Pending forever. The
    # shared workspace is made writable by the pipelines-scc RoleBinding in bootstrap/ instead.
    serviceAccountName: deployer
  params:
    - name: service
      value: sample-service
    - name: gitUrl
      value: https://github.com/ndc-dxc/istat-ndc-sample-service
    - name: gitRevision
      value: main
    - name: env
      value: dev
    - name: imageTag
      value: replace-with-the-built-sha
  workspaces:
    - name: source
      persistentVolumeClaim:
        claimName: pipeline-workspace
  timeouts:
    pipeline: 20m
