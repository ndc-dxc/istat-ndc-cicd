apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: helm-deploy
  labels:
    app.kubernetes.io/part-of: istat-ndc-platform
spec:
  description: >-
    Idempotent, transactional deploy. `--atomic --wait` means a rollout that never becomes
    healthy is rolled back to the previous release automatically, instead of leaving the
    namespace in a half-applied state.
  params:
    - name: release
      description: Helm release name, normally the service name.
    - name: env
      description: Target environment. Only dev and test are reachable from this pipeline.
    - name: chartPath
      default: deploy
    - name: imageTag
    - name: namespacePrefix
      default: istat-ndc
    - name: timeout
      default: 5m
    - name: helmImage
      default: docker.io/alpine/helm:3.21.4
  workspaces:
    - name: source
  results:
    - name: namespace
      description: Namespace the release was deployed to.
    - name: revision
      description: Helm revision number after the upgrade.
  steps:
    - name: upgrade
      image: $(params.helmImage)
      workingDir: $(workspaces.source.path)
      script: |
        #!/usr/bin/env sh
        set -eu

        # Production is released by the existing ISTAT blue/green pipelines. This pipeline
        # must not be a way around that, so the guard is here and not only in the trigger.
        case "$(params.env)" in
          dev|test) ;;
          *) echo "env '$(params.env)' is not deployable from this pipeline (dev and test only)" >&2; exit 1 ;;
        esac

        NS="$(params.namespacePrefix)-$(params.env)"

        helm upgrade --install "$(params.release)" "$(params.chartPath)" \
          --namespace "$NS" \
          -f "$(params.chartPath)/values.yaml" \
          -f "$(params.chartPath)/values-$(params.env).yaml" \
          --set image.tag="$(params.imageTag)" \
          --atomic --wait --timeout "$(params.timeout)"

        printf '%s' "$NS" > "$(results.namespace.path)"
        helm history "$(params.release)" -n "$NS" --max 1 -o json \
          | grep -o '"revision":[0-9]*' | head -1 | cut -d: -f2 \
          | tr -d '\n' > "$(results.revision.path)"
